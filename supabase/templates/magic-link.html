<!doctype html>
<html lang="en">
  <body
    style="
      font-family: system-ui, sans-serif;
      color: #203b36;
      background: #f7f8f5;
      padding: 24px;
    "
  >
    <h1>Reseller Agent sign-in code</h1>
    <p>Return to Reseller Agent and enter this code to sign in:</p>
    <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px">
      {{ .Token }}
    </p>
    <p>
      You can read this email on any device. Enter the code in the app where you
      want to sign in.
    </p>
    <p>
      This code can only be used once. Never share it. If you did not request
      it, ignore this email.
    </p>
  </body>
</html>
