<!doctype html>
<html lang="en" data-reseller-offline="v1">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#275a49" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Reconnect — Reseller Agent</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f8f5;
        color: #203b36;
        font:
          18px/1.6 system-ui,
          sans-serif;
        padding: 24px;
        padding-bottom: max(24px, env(safe-area-inset-bottom));
      }
      main {
        max-width: 480px;
        background: #fff;
        padding: 32px;
        border: 1px solid #e2e7e1;
        border-radius: 20px;
      }
      h1 {
        font:
          40px/1.15 Georgia,
          serif;
      }
      p {
        color: #53665e;
      }
      a {
        display: inline-block;
        background: #275a49;
        color: #fff;
        padding: 14px 24px;
        border-radius: 10px;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #203b36;
        outline-offset: 4px;
      }
      small {
        display: block;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>reseller<span style="font-weight: 400">agent</span></strong>
      <h1>You’re offline.</h1>
      <p>
        Reconnect to load your private workspace. Inventory, photos and buyer
        replies need an internet connection.
      </p>
      <a href="/">Try again</a
      ><small
        >Changes are not queued automatically. If you had unsaved edits, return
        to the previous screen before closing the app.</small
      >
    </main>
  </body>
</html>
